name: Validate

on:
  pull_request:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    name: ${{ matrix.task }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install

      - name: Run lint
        if: matrix.task == 'lint'
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}"

      - name: Run typecheck
        if: matrix.task == 'typecheck'
        run: pnpm run typecheck

      - name: Run tests
        if: matrix.task == 'test'
        run: pnpm test -- --maxWorkers=2 --maxConcurrent=2

  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install
      - run: pnpm run build
